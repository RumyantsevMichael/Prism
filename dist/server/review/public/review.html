<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17152b">
  <title>Prism review</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./review.css">
  <script src="./vendor/viz-global.js"></script>
</head>
<body>
  <header class="topbar">
    <span class="brand" title="Prism review">
      <span class="brand-mark" aria-hidden="true"><i></i></span>
      <span class="sr-only">Prism review</span>
    </span>
    <div class="project-switcher" id="project-switcher">
      <button class="project-chip" id="project-button" type="button" aria-expanded="false" aria-controls="project-menu" title="Project root" disabled>
        <span id="project" class="project-label">Loading project</span>
        <span id="project-gates" class="project-gates" hidden></span>
      </button>
      <div id="project-menu" class="project-menu" hidden>
        <p class="project-menu-title">Projects</p>
        <ul id="project-list" class="project-list"></ul>
      </div>
    </div>
    <div class="indexing" id="indexing" hidden>
      <button class="indexing-chip" id="indexing-button" type="button" aria-expanded="false" aria-controls="indexing-panel">
        <span class="indexing-dot" aria-hidden="true"></span>
        <span id="indexing-label" class="indexing-label"></span>
        <span id="indexing-meter" class="indexing-meter" aria-hidden="true" hidden><span></span></span>
        <span id="indexing-detail" class="indexing-detail" hidden></span>
      </button>
      <div id="indexing-panel" class="indexing-panel" role="dialog" aria-label="Repository index" hidden></div>
    </div>
    <div id="tabs" class="artifact-tabs" role="tablist" aria-label="Open artifacts"></div>
  </header>
  <div id="notice" class="notice-banner" role="status" aria-live="polite" hidden></div>
  <div id="connection" class="connection-banner" role="alert" hidden>The review server is not responding. Retrying…</div>
  <main class="app-shell" id="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Workspace navigation">
      <div class="sidebar-top">
        <div class="sidebar-tools">
          <button id="jump" class="jump-button" type="button" aria-haspopup="dialog" title="Jump to (Ctrl K)">
            <span class="search-icon" aria-hidden="true"></span>
            <span class="jump-label">Jump to…</span>
            <kbd>Ctrl K</kbd>
          </button>
          <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-controls="sidebar" aria-expanded="true" title="Collapse the sidebar ([)">
            <span class="sr-only">Collapse the sidebar</span>
          </button>
        </div>
        <ul id="nav-places" class="nav-tree" aria-label="Places"></ul>
      </div>
      <nav class="sidebar-scroll" aria-label="Prism workspace">
        <ul id="artifacts" class="nav-tree"></ul>
      </nav>
      <div class="sidebar-library">
        <ul id="nav-library" class="nav-tree" aria-label="Library"></ul>
      </div>
    </aside>
    <section class="workspace" id="workspace">
      <div id="artifact" class="artifact-view" aria-live="polite">
        <div class="welcome-card">
          <span class="welcome-mark" aria-hidden="true"></span>
          <p class="eyebrow">Human review</p>
          <h1>Loading the workspace</h1>
          <p>Attention, the roadmap, and the library open here.</p>
        </div>
      </div>
    </section>
  </main>
  <aside id="evidence-drawer" class="evidence-drawer" aria-label="Evidence" hidden>
    <header class="evidence-drawer-header">
      <div class="evidence-trail" id="evidence-trail"></div>
      <button class="tool-button" id="evidence-close" type="button" aria-label="Close evidence">Close</button>
    </header>
    <div class="evidence-drawer-body" id="evidence-body"></div>
  </aside>
  <div id="palette" class="palette" role="dialog" aria-modal="true" aria-label="Jump to" hidden>
    <div class="palette-panel">
      <label class="search-box palette-search">
        <span class="search-icon" aria-hidden="true"></span>
        <span class="sr-only">Jump to</span>
        <input id="palette-input" type="search" placeholder="Name of an initiative, slice, document, or file, or text in an artifact" autocomplete="off" role="combobox" aria-controls="palette-results" aria-expanded="true">
      </label>
      <ul id="palette-results" class="palette-results" role="listbox" aria-label="Matches"></ul>
      <p class="palette-hint">Enter opens in the preview tab · Ctrl+Enter keeps it open · Esc closes</p>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="./review.js"></script>
</body>
</html>
