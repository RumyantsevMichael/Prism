name: Native semantic runtime

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      publish:
        type: boolean
        default: false
  pull_request:
    paths: ['src/**', 'dist/server/**', 'dist/native-runtime/**', 'dist/hooks/**', 'test/**', 'bin/**', 'hooks/**', '.mcp.json', '.codex-mcp.json', 'package.json', 'tsconfig.native.json', 'scripts/build-native-runtime.mjs', 'scripts/native-build/**', 'vendor/native-runtime/**', '.github/workflows/native-runtime.yml', '.github/workflows/native-default.yml', '.github/workflows/release.yml']
  push:
    branches: ['codex/native-runtime-assets']
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        description: Publish verified immutable runtime assets

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-2025
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - name: Install pinned build dependencies without scripts
        run: |
          npm ci --prefix src/native-runtime --ignore-scripts --no-audit --no-fund
          npm ci --prefix scripts/native-build --ignore-scripts --no-audit --no-fund
      - name: Check TypeScript and generated JavaScript
        run: npm run check:native
      - name: Patch the embedded SDK
        run: node dist/native-runtime/patch-codegraph.mjs src/native-runtime/node_modules/@colbymchenry/codegraph-${{ matrix.platform }}/lib/dist
      - name: Stage native dependencies
        run: npm run stage:native

      - name: Test parsers, language relationships, and containment
        run: |
          node --liftoff-only --test --test-reporter=tap --test-timeout=120000 test/native-runtime/*.test.mjs
          node --test --test-reporter=tap --test-timeout=120000 scripts/native-build/*.test.mjs test/server/native-semantics.test.mjs test/server/conservation.test.mjs test/server/concept-delta-mcp.test.mjs
      - name: Build an immutable runtime archive
        env:
          PRISM_NATIVE_RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download/native-runtime-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/build-native-runtime.mjs
      - name: Test the packaged runtime without external indexers
        run: |
          node scripts/native-build/smoke.mjs dist/native
          node scripts/native-build/mcp-smoke.mjs dist/native
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: |
            dist/native/*.tar.gz
            dist/native/${{ matrix.platform }}.json
          compression-level: 0
  publish:
    if: inputs.publish || (github.event_name == 'push' && github.ref == 'refs/heads/codex/native-runtime-assets')
    needs: runtime
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: assets
          merge-multiple: true
      - name: Publish assets before manifest promotion
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: native-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_COMMIT: ${{ inputs.source_ref || github.sha }}
        run: gh release create "$RELEASE_TAG" assets/* --target "$SOURCE_COMMIT" --prerelease --title "$RELEASE_TAG" --notes "Pinned native semantic runtime assets. Platform parser and packaged inference checks passed before publication."
  verify-default:
    needs: publish
    uses: ./.github/workflows/native-default.yml
    with:
      source_ref: ${{ inputs.source_ref || github.sha }}
      release_tag: native-runtime-${{ github.run_id }}-${{ github.run_attempt }}
      manifest_artifact: verified-native-manifest
