name: Native semantic runtime

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      release_tag:
        description: The release whose assets the bundles' metadata names
        required: true
        type: string
  pull_request:
    paths: ['src/**', 'dist/server/**', 'dist/native-runtime/**', 'dist/hooks/**', 'test/**', 'bin/**', 'hooks/**', '.claude-mcp.json', '.codex-mcp.json', 'package.json', 'tsconfig.native.json', 'scripts/build-native-runtime.mjs', 'scripts/native-build/**', 'vendor/native-runtime/**', '.github/workflows/native-runtime.yml', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-2025
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - name: Install pinned build dependencies without scripts
        run: |
          npm ci --prefix src/native-runtime --ignore-scripts --no-audit --no-fund
          npm ci --prefix scripts/native-build --ignore-scripts --no-audit --no-fund
      - name: Build the runtime from TypeScript
        run: npm run build:native
      - name: Patch the embedded SDK
        run: node dist/native-runtime/patch-codegraph.mjs src/native-runtime/node_modules/@colbymchenry/codegraph-${{ matrix.platform }}/lib/dist
      - name: Stage native dependencies
        run: npm run stage:native

      - name: Test parsers, language relationships, and containment
        run: |
          node --liftoff-only --test --test-reporter=tap --test-timeout=120000 test/native-runtime/*.test.mjs
          node --test --test-reporter=tap --test-timeout=120000 scripts/native-build/*.test.mjs test/server/native-semantics.test.mjs test/server/conservation.test.mjs test/server/change-map-mcp.test.mjs
      - name: Build an immutable runtime archive
        env:
          # Bundles are published only as assets of the release they ship in, so their metadata names that release.
          PRISM_NATIVE_RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag || 'unreleased' }}
        run: node scripts/build-native-runtime.mjs
      - name: Test the packaged runtime without external indexers
        run: |
          node scripts/native-build/smoke.mjs dist/native
          node scripts/native-build/mcp-smoke.mjs dist/native
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: |
            dist/native/*.tar.gz
            dist/native/${{ matrix.platform }}.json
          compression-level: 0
