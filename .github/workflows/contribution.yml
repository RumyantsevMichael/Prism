name: Contribution rules

# pull_request_target runs this workflow and script as they are on the base branch, so an outside pull request cannot change the check that judges it.
# The job never checks out or runs the pull request's code, and its token can only read.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: contribution-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contribution-rules:
    name: Contribution rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check sign-off, ownership, accepted proposal, and authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-contribution.mjs
