<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17152b">
  <title>Prism review</title>
  <link rel="stylesheet" href="./review.css">
  <script src="./vendor/viz-global.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i></i></span>
      <span>
        <strong>Prism</strong>
        <small>Artifact review</small>
      </span>
    </div>
    <div class="project-chip" title="Project root">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="project">Loading project</span>
    </div>
  </header>
  <main class="app-shell">
    <aside class="sidebar" aria-label="Artifact navigation">
      <div class="sidebar-heading">
        <div>
          <p class="eyebrow">Workspace</p>
          <h2>Artifacts</h2>
        </div>
        <span id="artifact-count" class="count-badge">0</span>
      </div>
      <label class="search-box">
        <span class="search-icon" aria-hidden="true"></span>
        <span class="sr-only">Filter artifacts</span>
        <input id="artifact-filter" type="search" placeholder="Filter artifacts" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <nav aria-label="Artifacts">
        <ol id="artifacts" class="artifact-list"></ol>
        <p id="empty-filter" class="empty-filter" hidden>No matching artifacts.</p>
      </nav>
      <div class="sidebar-footer">
        <span class="live-indicator"><i aria-hidden="true"></i>Auto refresh</span>
        <span>1.5 seconds</span>
      </div>
    </aside>
    <section class="workspace">
      <div id="artifact" class="artifact-view" aria-live="polite">
        <div class="welcome-card">
          <span class="welcome-mark" aria-hidden="true"></span>
          <p class="eyebrow">Human review</p>
          <h1>Select an artifact</h1>
          <p>Choose a source artifact to review its prose and diagrams together.</p>
        </div>
      </div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="./review.js"></script>
</body>
</html>
